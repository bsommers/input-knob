<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Input Knob logo">
  <title>Input Knob</title>
  <defs>
    <linearGradient id="bezel" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#c9cfd6"/>
      <stop offset="0.55" stop-color="#7d8792"/>
      <stop offset="0.78" stop-color="#d6dbe1"/>
      <stop offset="1" stop-color="#5a626c"/>
    </linearGradient>
    <linearGradient id="bezelInner" x1="0.85" y1="0.95" x2="0.15" y2="0.05">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="0.5" stop-color="#8a939d"/>
      <stop offset="1" stop-color="#3e454d"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#1a1f2a"/>
      <stop offset="0.6" stop-color="#07090d"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3498DB"/>
      <stop offset="0.35" stop-color="#20C878"/>
      <stop offset="0.7" stop-color="#F39C12"/>
      <stop offset="1" stop-color="#9B59B6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c6d6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screen"><circle cx="256" cy="256" r="166"/></clipPath>
  </defs>

  <!-- Bezel with knurled edge -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="236" fill="url(#bezel)"/>
  </g>
  <g stroke="#2b3138" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <!-- 72 knurl ticks, every 5 degrees -->
    <g id="knurl">
      <line x1="256" y1="24" x2="256" y2="40"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(5 256 256)"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(10 256 256)"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(15 256 256)"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(20 256 256)"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(25 256 256)"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(30 256 256)"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(35 256 256)"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(40 256 256)"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(45 256 256)"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(50 256 256)"/>
      <line x1="256" y1="24" x2="256" y2="40" transform="rotate(55 256 256)"/>
    </g>
    <use href="#knurl" transform="rotate(60 256 256)"/>
    <use href="#knurl" transform="rotate(120 256 256)"/>
    <use href="#knurl" transform="rotate(180 256 256)"/>
    <use href="#knurl" transform="rotate(240 256 256)"/>
    <use href="#knurl" transform="rotate(300 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="256" cy="256" r="196" fill="url(#bezelInner)"/>
  <circle cx="256" cy="256" r="178" fill="#0b0d11"/>

  <!-- Screen -->
  <circle cx="256" cy="256" r="166" fill="url(#glass)"/>
  <g clip-path="url(#screen)">
    <!-- dial track -->
    <circle cx="256" cy="256" r="138" fill="none" stroke="#1b2029" stroke-width="20"/>
    <!-- glowing value arc: 135deg (bottom-left) round to 45deg (top-right), 270deg sweep -->
    <path d="M 158.42 353.58 A 138 138 0 1 1 353.58 158.42" fill="none" stroke="url(#arc)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
    <!-- needle tip -->
    <circle cx="353.58" cy="158.42" r="13" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="353.58" cy="158.42" r="6" fill="#9B59B6"/>

    <!-- sound wave mark: speaker + two waves -->
    <g fill="url(#wave)" filter="url(#softGlow)">
      <path d="M 196 230 L 222 230 L 256 200 L 256 312 L 222 282 L 196 282 Q 188 282 188 274 L 188 238 Q 188 230 196 230 Z"/>
    </g>
    <g fill="none" stroke="url(#wave)" stroke-width="13" stroke-linecap="round" filter="url(#softGlow)">
      <path d="M 280 228 Q 296 256 280 284"/>
      <path d="M 302 206 Q 334 256 302 306"/>
    </g>
    <!-- glass highlight -->
    <ellipse cx="206" cy="168" rx="120" ry="58" fill="#ffffff" fill-opacity="0.05" transform="rotate(-28 206 168)"/>
  </g>

  <!-- Five LEDs in the mode colours, along the bottom of the bezel -->
  <g filter="url(#softGlow)">
    <circle cx="186" cy="442" r="8" fill="#3498DB"/>
    <circle cx="220" cy="455" r="8" fill="#20C878"/>
    <circle cx="256" cy="460" r="8" fill="#ffffff"/>
    <circle cx="292" cy="455" r="8" fill="#F39C12"/>
    <circle cx="326" cy="442" r="8" fill="#9B59B6"/>
  </g>
</svg>
